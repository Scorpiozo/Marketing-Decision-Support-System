{% extends "base.html" %}
{% block title %}Sign in · Lead Decision Intelligence{% endblock %}
{% block content %}
<div class="card login">
  <h1>Sign in</h1>
  <p class="text-2 small">This research demo is password-protected so it isn't open to the whole internet.</p>
  {% if error %}<div class="callout" role="alert">That password didn't work. Try again.</div>{% endif %}
  <form method="post" action="/login" class="stack" style="margin-top:12px">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">Password<input type="password" name="password" autofocus required autocomplete="current-password"></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
