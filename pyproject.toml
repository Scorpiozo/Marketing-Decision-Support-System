[project]
name = "leadintel"
version = "2.0.0"
description = "Interpretable interaction-pattern-based lead decision intelligence on the UCI Bank Marketing dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]",
    "jinja2",
    "loguru",
    "numpy",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "scikit-learn",
    "shap",
    "threadpoolctl",
]

[dependency-groups]
dev = ["httpx", "pandas-stubs", "pyright", "pytest", "ruff"]
# The legacy 1D-CNN experiment. Heavy (~600 MB), so it is opt-in: `uv sync --group dl`.
dl = ["tensorflow"]

[project.scripts]
leadintel-train = "leadintel.train:main"
leadintel-experiments = "leadintel.experiments.run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadintel"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["E501"] }
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# En dashes / multiplication signs are deliberate typography in user-facing copy.
ignore = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains models (seconds, not minutes)"]
